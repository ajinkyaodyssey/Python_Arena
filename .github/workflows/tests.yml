# .github/workflows/tests.yml
#
# PIPELINE ARCHITECTURE:
#
#  push/PR:
#    lint (10s)
#      ├── unit-tests (10s)   ← parallel
#      └── test-ui (3min)     ← parallel
#
#  nightly 2AM UTC:
#    lint
#      ├── unit-tests
#      ├── test-ui
#      ├── test-api           ← reqres.in limit resets daily
#      └── regression         ← full suite
#
#  manual trigger:
#    all jobs run on demand

name: SDET Framework Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 2:00 AM UTC
    # Cron: minute hour day month weekday
    # 0     2    *   *     *  = every day at 2AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual trigger from GitHub Actions UI
    # Runs all jobs including API tests
    inputs:
      run_full_suite:
        description: 'Run full suite including API tests'
        required: false
        default: 'false'
        type: boolean

# Cancel old runs when new push arrives on same branch
# Prevents queue buildup during rapid development
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================
  # JOB 1: Lint
  # Trigger: every push and PR
  # Purpose: catch syntax errors before wasting
  #          3 minutes on browser test setup
  # Speed: ~10 seconds
  # ============================================
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8==7.0.0

      - name: Run flake8
        run: |
          flake8 week4/pom_framework/ week5/ \
            --max-line-length=100 \
            --count \
            --statistics

  # ============================================
  # JOB 2: Unit Tests
  # Trigger: every push, after lint
  # Parallel with: test-ui
  # Speed: ~10 seconds
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest week1/saturday_project/test_library_system.py \
            -v --tb=short \
            --html=reports/unit_report.html \
            --self-contained-html

      # if: always() explained:
      # Default behaviour: if 'Run unit tests' fails,
      # GitHub skips this upload step.
      # That means no report when you need it most.
      # if: always() forces upload regardless of test result.
      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: reports/unit_report.html
          retention-days: 7

  # ============================================
  # JOB 3: UI Tests (Playwright)
  # Trigger: every push, after lint
  # Parallel with: unit-tests
  # Speed: ~3 minutes
  # ============================================
  # ============================================
  # JOB 3: UI Tests (Playwright) — Matrix
  # Runs: every push, after lint passes
  # Matrix: chromium AND firefox in parallel
  # Why matrix: one job definition runs twice
  # automatically with different browser values.
  # Adding webkit later = one word change.
  # ============================================
  test-ui:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      # fail-fast: false means if chromium fails,
      # firefox still runs to completion.
      # Without this, one browser failure cancels
      # the other — you lose cross-browser data.
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        # Install only the browser we need for this matrix run
        # Not all browsers — saves 1-2 minutes per run
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run UI tests
        run: |
          pytest week4/pom_framework/tests/ \
            week7/day35/test_always_demo.py \
            -v --tb=short \
            --browser ${{ matrix.browser }} \
            --html=reports/ui_report_${{ matrix.browser }}.html \
            --self-contained-html

      # FAILURE SCREENSHOT UPLOAD — the key step
      # How this works end to end:
      # 1. A Playwright test fails
      # 2. conftest.py screenshot_on_failure hook fires
      # 3. page.screenshot() saves PNG to reports/screenshots/
      # 4. This step uploads that folder to GitHub
      # 5. Go to Actions → your run → Artifacts section
      # 6. Download ui-test-report zip
      # 7. Open the screenshots folder
      # 8. See exactly what the browser showed at failure
      #
      # Without if: always():
      # Step fires only on success → no screenshots when failing
      # With if: always():
      # Step fires regardless → screenshots always available
      - name: Upload UI test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Include browser name in artifact name
          # Without this both matrix runs upload to
          # the same name and overwrite each other
          name: ui-report-${{ matrix.browser }}
          path: |
            reports/ui_report_${{ matrix.browser }}.html
            reports/screenshots/
          retention-days: 7

  # ============================================
  # JOB 4: API Tests
  # Trigger: NIGHTLY + MANUAL ONLY
  #
  # WHY NOT ON PUSH:
  # reqres.in free tier = ~100 requests/day
  # Week5 suite = ~50 requests per run
  # 2 pushes per day = quota exhausted = 429 errors
  #
  # FIX: Run at 2AM UTC after daily limit resets
  # schedule trigger fires at 2AM, limit resets at midnight
  # ============================================
  test-api:
    name: API Tests (reqres.in)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pytest week5/ \
            -v --tb=short \
            --html=reports/api_report.html \
            --self-contained-html
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          TEST_ENV: staging

      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/api_report.html
          retention-days: 7

  # ============================================
  # JOB 5: Regression (Full Suite)
  # Trigger: NIGHTLY + MANUAL ONLY
  # Needs: unit-tests AND test-ui both green
  # Speed: ~8-10 minutes
  # ============================================
  regression:
    name: Regression (Full Suite)
    runs-on: ubuntu-latest
    needs: [unit-tests, test-ui]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run full regression suite
        run: |
          pytest \
            week1/saturday_project/ \
            week4/pom_framework/tests/ \
            week6/day27/ \
            week6/day28/ \
            week6/day29/ \
            week6/day31/ \
            -v --tb=short \
            --html=reports/regression_report.html \
            --self-contained-html
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Upload regression report and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            reports/regression_report.html
            reports/screenshots/
          retention-days: 14

      - name: Upload DB files on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: db-files-on-failure
          path: week6/**/*.db
          retention-days: 3