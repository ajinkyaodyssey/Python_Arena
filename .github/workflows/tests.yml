# .github/workflows/tests.yml
#
# PIPELINE DESIGN:
# ─────────────────────────────────────────────
# lint          → every push, ~10s, blocks all tests
# unit-tests    → every push, ~10s, after lint
# test-ui       → every push, ~3min, parallel with unit
# test-api      → nightly only (reqres.in rate limit)
# regression    → nightly only, full suite
#
# PARALLELISM:
# unit-tests and test-ui both need lint.
# They run at the same time after lint passes.
# Total time: lint(10s) + max(unit(10s), ui(3min)) = ~3min
# Without parallelism: lint + unit + ui = ~4min
# With parallelism saves time as suite grows larger.

name: SDET Framework Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_api_tests:
        description: 'Run API tests (uses reqres.in quota)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================
  # JOB 1: Lint
  # Runs: every push and PR
  # Blocks: all other jobs
  # Why first: no point running 200 tests against
  # code that has syntax errors or undefined names
  # ============================================
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8==7.0.0

      - name: Run flake8
        run: |
          flake8 week4/pom_framework/ week5/ \
            --max-line-length=100 \
            --count \
            --statistics
        # --count: prints total error count at end
        # --statistics: shows which rules were violated most

  # ============================================
  # JOB 2: Unit Tests
  # Runs: every push, after lint passes
  # Parallel with: test-ui
  # Speed: ~10 seconds
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest week1/saturday_project/test_library_system.py \
            -v --tb=short \
            --html=reports/unit_report.html \
            --self-contained-html

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: reports/unit_report.html
          retention-days: 7

  # ============================================
  # JOB 3: UI Tests (Playwright)
  # Runs: every push, after lint passes
  # Parallel with: unit-tests
  # Speed: ~3 minutes
  # ============================================
  test-ui:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run UI tests
        run: |
          pytest week4/pom_framework/tests/ \
            -v --tb=short \
            --html=reports/ui_report.html \
            --self-contained-html

      - name: Upload UI test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-report
          path: |
            reports/ui_report.html
            reports/screenshots/
          retention-days: 7

  # ============================================
  # JOB 4: API Tests
  # Runs: NIGHTLY + MANUAL ONLY
  # Why not on push: reqres.in rate limit
  # ~100 requests/day, suite uses ~50 per run
  # Fix: schedule at 2AM after daily reset
  # ============================================
  test-api:
    name: API Tests (reqres.in)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pytest week5/ \
            -v --tb=short \
            --html=reports/api_report.html \
            --self-contained-html
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          TEST_ENV: staging

      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/api_report.html
          retention-days: 7

  # ============================================
  # JOB 5: Regression (Full Suite)
  # Runs: NIGHTLY + MANUAL ONLY
  # Needs: unit-tests AND test-ui both passing
  # Speed: ~8-10 minutes
  # ============================================
  regression:
    name: Regression (Full Suite)
    runs-on: ubuntu-latest
    needs: [unit-tests, test-ui]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run full regression suite
        run: |
          pytest \
            week1/saturday_project/ \
            week4/pom_framework/tests/ \
            week6/day27/ \
            week6/day28/ \
            week6/day29/ \
            week6/day31/ \
            -v --tb=short \
            --html=reports/regression_report.html \
            --self-contained-html
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

      - name: Upload regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            reports/regression_report.html
            reports/screenshots/
          retention-days: 14