# pytest.ini
# Central configuration for the entire test suite.
# pytest reads this automatically on every run.

[pytest]

# =============================================
# TEST DISCOVERY
# =============================================
# Where pytest looks for tests.
# Without this, pytest searches everywhere including venv — slow.
testpaths =
    week1/saturday_project
    week3/saturday_project
    week4/day19
    week4/pom_framework/tests

# File and function naming conventions (these are actually the defaults
# but being explicit documents the standard for the team)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =============================================
# DEFAULT OPTIONS
# =============================================
# These flags apply to every pytest run automatically.
# No need to type them on the command line.
addopts =
    -v
    --strict-markers
    --tb=short

# -v:              verbose output — show each test name
# --tb=short:      shorter tracebacks — easier to read failures
# --strict-markers: fail if a test uses an unregistered marker
#                   prevents typos like @pytest.mark.smok silently doing nothing

# =============================================
# CUSTOM MARKERS
# =============================================
# Every custom marker MUST be registered here.
# With --strict-markers, any unregistered marker causes an error.
# This catches typos immediately instead of silently skipping tests.
markers =
    smoke: Critical path tests. Run on every commit. Must pass before merge.
    regression: Full suite. Run nightly or before releases.
    api: API-only tests. No browser required.
    ui: UI tests requiring a browser.
    slow: Tests taking more than 10 seconds. Excluded from quick runs.
    wip: Work in progress. Skipped in CI until ready.

# =============================================
# TIMEOUT (optional — needs pytest-timeout)
# =============================================
# Uncomment after: pip install pytest-timeout
# timeout = 60