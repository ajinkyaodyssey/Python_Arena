# pytest.ini
# Central configuration for the entire test suite.
# pytest reads this automatically on every run.

[pytest]

# =============================================
# TEST DISCOVERY
# =============================================
# Where pytest looks for tests.
# Without this, pytest searches everywhere including venv — slow.
testpaths =
    week1/saturday_project
    week3/saturday_project
    week4/pom_framework/tests
    week4/day19
    week4/day20
    week5/day22
    week5/day23
    week5/day24

# File and function naming conventions (these are actually the defaults
# but being explicit documents the standard for the team)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =============================================
# DEFAULT OPTIONS
# =============================================
# These flags apply to every pytest run automatically.
# No need to type them on the command line.
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html      
    # Generates the test/report output in HTML format and saves it as reports/report.html
    --self-contained-html           
    # Creates a self-contained HTML report by embedding required resources such as CSS and JavaScript within the report file
                                    # Revision note: Ensure the reports directory exists before generating the report, or configure the tool to create it automatically.

# -v:              verbose output — show each test name
# --tb=short:      shorter tracebacks — easier to read failures
# --strict-markers: fail if a test uses an unregistered marker
#                   prevents typos like @pytest.mark.smok silently doing nothing

# =============================================
# CUSTOM MARKERS
# =============================================
# Every custom marker MUST be registered here.
# With --strict-markers, any unregistered marker causes an error.
# This catches typos immediately instead of silently skipping tests.
markers =
    smoke: Critical path tests. Run on every commit. Must pass before merge.
    regression: Full suite. Run nightly or before releases.
    api: API-only tests. No browser required.
    ui: UI tests requiring a browser.
    slow: Tests taking more than 10 seconds. Excluded from quick runs.
    wip: Work in progress. Skipped in CI until ready.


log_cli = true      
# Enables real-time logging in the terminal during test execution.
log_cli_level = INFO      
# Displays log messages at the INFO level and above in the terminal.  
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s       
# Defines the terminal log format to include the timestamp, log level, logger name, and message
log_file = reports/test_run.log         
# Saves test execution logs to reports/test_run.log for later review and troubleshooting
log_file_level = INFO       
# Records INFO-level and higher log messages in the log file
log_file_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s      
# Defines the format of log messages written to the log file, including timestamp, log level, logger name, and message
# =============================================
# TIMEOUT (optional — needs pytest-timeout)
# =============================================
# Uncomment after: pip install pytest-timeout
# timeout = 60